name: Correction checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correction:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out software
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: python3 -S -m compileall -q predict.py correct_age.py preprocessing.py scripts tests
      - name: Test correction without inference dependencies
        run: python3 -S -m unittest discover -s tests -v
